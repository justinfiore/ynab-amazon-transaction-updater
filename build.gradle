plugins {
    id 'groovy'
    id 'application'
}

group = 'com.ynab.amazon'
version = '1.0.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    implementation platform('org.apache.groovy:groovy-bom:5.1.0')
    implementation 'org.apache.groovy:groovy'
    implementation 'org.yaml:snakeyaml:2.6'
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.6.4'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.2'

    // Logging
    implementation 'ch.qos.logback:logback-classic:1.6.3'

    // Jakarta Mail API and Angus Mail implementation for email functionality
    implementation 'jakarta.mail:jakarta.mail-api:2.1.5'
    runtimeOnly 'org.eclipse.angus:angus-mail:2.0.5'

    // Playwright for browser automation
    implementation 'com.microsoft.playwright:playwright:1.62.0'

    testImplementation 'org.spockframework:spock-core:2.4-groovy-5.0'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'
}

application {
    mainClass = 'com.ynab.amazon.YNABAmazonTransactionUpdater'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    reports {
        junitXml.required = true
        html.required = true
    }
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

tasks.named('test', Test) {
    description = 'Runs only the unit tests.'
    include '**/*_UT*'
}

tasks.register('unitTest') {
    description = 'Runs only the unit tests.'
    group = 'verification'
    dependsOn tasks.named('test')
}

def integrationTest = tasks.register('integrationTest', Test) {
    description = 'Runs only the integration tests.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/*_IT*'
    mustRunAfter tasks.named('test')
}

tasks.register('testAll') {
    description = 'Runs unit tests first, followed by integration tests.'
    group = 'verification'
    dependsOn tasks.named('test')
    dependsOn integrationTest
}

tasks.named('check') {
    dependsOn tasks.named('testAll')
}
