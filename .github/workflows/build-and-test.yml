name: Build and test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Java 25 unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up maintained Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Run Python bridge and pinned-library contract tests
        run: |
          python3 -m venv .venv-amazon-orders
          .venv-amazon-orders/bin/python -m pip install --require-hashes -r requirements-amazon-orders.txt
          .venv-amazon-orders/bin/python -m pip check
          .venv-amazon-orders/bin/python -m unittest scripts/test_amazon_orders_bridge.py

      - name: Verify optional browser-login lock and offline contracts
        run: |
          python3 -m venv .venv-amazon-browser
          .venv-amazon-browser/bin/python -m pip install --require-hashes -r requirements-amazon-browser.txt
          .venv-amazon-browser/bin/python -m pip check
          .venv-amazon-browser/bin/python -m unittest scripts/test_amazon_orders_bridge.py

      - name: Run unit and integration tests
        id: gradle-test
        shell: bash
        run: |
          set +e
          set -o pipefail
          ./gradlew clean testAll --no-daemon 2>&1 | tee gradle-test-output.log
          exit_code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"

      - name: Publish test results in check summary
        if: always()
        env:
          TEST_RESULTS_DIR: build/test-results
        run: python3 .github/scripts/publish_test_summary.py "$TEST_RESULTS_DIR"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            build/test-results/test/
            build/test-results/integrationTest/
            build/reports/tests/test/
            build/reports/tests/integrationTest/
            gradle-test-output.log
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if Gradle tests failed
        if: always() && steps.gradle-test.outputs.exit_code != '0'
        run: exit 1

  walmart-native:
    name: Optional Walmart / ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Set up Python for account-free bridge fixtures
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Enabled lifecycle and native packaging
        run: ./gradlew clean build installDist distZip distTar -Pwalmart --no-daemon
      - name: Cached offline lifecycle
        run: ./gradlew build installDist -Pwalmart --offline --no-daemon
      - name: Launch packaged helper without Go on PATH
        run: |
          helper=$(find build/install -name walmart-helper -type f -perm -111 | head -n 1)
          test -n "$helper"
          set +e
          printf '%s' '{"version":999}' | env -u PATH PATH=/usr/bin:/bin "$helper" >/tmp/helper-out.json
          helper_status=$?
          set -e
          test "$helper_status" -ne 0
          python3 - "$helper" << 'PY'
          import json, sys
          from pathlib import Path
          body = json.loads(Path('/tmp/helper-out.json').read_text() or '{}')
          assert body.get('status') == 'fetch_failed', body
          text = Path(sys.argv[1]).read_bytes().decode('latin1')
          for forbidden in ['OPENAI_API_KEY', 'YNAB_API_TOKEN', 'category_id', 'gpt-6']:
              assert forbidden not in text, forbidden
          PY
      - name: Reject a rewritten Go SDK digest without downloading
        run: |
          python3 - << 'PY'
          import json
          from pathlib import Path
          path = Path('gradle/go-sdk-sha256.json')
          data = json.loads(path.read_text())
          data['linux-amd64'] = '0' * 64
          data['linux-arm64'] = '0' * 64
          path.write_text(json.dumps(data))
          PY
          set +e
          ./gradlew walmartGoSdk -Pwalmart --offline --no-daemon > /tmp/bad-sdk.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -q "no matching verified archive hash" /tmp/bad-sdk.log
          git checkout -- gradle/go-sdk-sha256.json
      - name: Base lifecycle after enabled build excludes native helper
        run: |
          ./gradlew build installDist --offline --no-daemon
          test -z "$(find build/install -name walmart-helper -print)"
      - name: Summarize JVM and Go tests
        if: always()
        run: python3 .github/scripts/publish_test_summary.py build/test-results
      - name: Upload native reports and target-labeled distributions
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: walmart-${{ matrix.runner }}
          path: |
            build/test-results/
            build/reports/tests/
            build/walmart/*.json
            build/distributions/*walmart-*
          retention-days: 14
