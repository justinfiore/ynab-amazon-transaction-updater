name: Build and test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Java 25 unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Run unit and integration tests
        id: gradle-test
        shell: bash
        run: |
          set +e
          set -o pipefail
          ./gradlew clean testAll --no-daemon 2>&1 | tee gradle-test-output.log
          exit_code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"

      - name: Publish test results in check summary
        if: always()
        env:
          TEST_RESULTS_DIR: build/test-results
        run: python3 .github/scripts/publish_test_summary.py "$TEST_RESULTS_DIR"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            build/test-results/test/
            build/test-results/integrationTest/
            build/reports/tests/test/
            build/reports/tests/integrationTest/
            gradle-test-output.log
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if Gradle tests failed
        if: always() && steps.gradle-test.outputs.exit_code != '0'
        run: exit 1
